<!DOCTYPE html>
<html>
<head>
    <title>Menu Canales Wiseplay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background-color: #222; color: #fff; text-align: center; padding: 20px; }
        .channel-item { border: 1px solid #444; margin-bottom: 10px; padding: 15px; border-radius: 8px; }
        .channel-name { font-size: 1.2em; margin-bottom: 10px; }
        /* Es crucial usar la etiqueta <a> para que Wiseplay pueda seguir el enlace */
        .btn-canal-action { 
            background-color: #007bff; color: white; padding: 10px 20px; 
            text-decoration: none; border-radius: 5px; display: inline-block;
            cursor: pointer; /* Lo hacemos parecer un botón */
        }
    </style>
</head>
<body>
    <h1>Selecciona un Canal de Prueba</h1>
    
    <div class="channel-item">
        <div class="channel-name">TNT Sports 1 UK -2</div>
        <a class="btn-canal-action" href="https://dlhd.dad/stream/stream-2.php?disableads=1&no-reload=1&autoplay=1">VER CANAL</a>
    </div>

    <div class="channel-item">
        <div class="channel-name">TNT Sports 1 UK -3</div>
        <a class="btn-canal-action" href="https://dlhd.dad/stream/stream-3.php?disableads=1&no-reload=1&autoplay=1">VER CANAL</a>
    </div>

</body>
</html>
